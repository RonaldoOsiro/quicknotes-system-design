<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes System Design & Client</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>QuickNotes</h1>
    <p class="subtitle">Capture your thoughts quickly and securely.</p>

    <section class="controls">
      <button id="load-btn">Load Notes</button>
    </section>

    <p id="status" class="status" aria-live="polite"></p>

    <section class="form-section">
      <h2>Create a New Note</h2>
      <form id="note-form">
        <div class="field">
          <label for="title-input">Title (required, max 100 characters):</label>
          <input type="text" id="title-input" maxlength="100" required placeholder="Note title...">
        </div>
        <div class="field">
          <label for="body-input">Body (optional):</label>
          <textarea id="body-input" rows="4" placeholder="Write your note here..."></textarea>
        </div>
        <button type="submit" id="submit-btn">Add Note</button>
      </form>
    </section>

    <section class="notes-section">
      <h2>Notes</h2>
      <ul id="notes-list"></ul>
    </section>
  </main>
</body>
</html>
